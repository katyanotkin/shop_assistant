steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/shop-assistant/web:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/shop-assistant/web:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - shop-assistant-web
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/shop-assistant/web:$COMMIT_SHA
      - --region=us-east1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE=tailoredloop
      - --set-secrets=ADMIN_PASSWORD=shop-assistant-admin-password:latest,GOOGLE_CLIENT_ID=shop-assistant-google-client-id:latest,GOOGLE_CLIENT_SECRET=shop-assistant-google-client-secret:latest,SESSION_SECRET=shop-assistant-session-secret:latest,BOOTSTRAP_ADMIN_EMAIL=shop-assistant-bootstrap-admin-email:latest

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/shop-assistant/web:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
