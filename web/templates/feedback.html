<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — __APP_NAME__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="stylesheet" href="/static/privacy.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F59E0B">
</head>
<body>

  <header class="topbar">
    <span class="topbar-logo">
      <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="30" height="30">
      <span class="topbar-brand">__APP_NAME__</span>
      <span class="topbar-motto">__APP_MOTTO__</span>
    </span>
    <a href="/" class="topbar-admin-btn">Home</a>
  </header>

  <div class="privacy-container">
    <h1>Feedback</h1>

    <div class="privacy-content">
      <p>Tell us what's working, what's broken, or what you'd like to see. If you're signed in, we'll link your feedback to your account so we can follow up; if not, it's submitted anonymously.</p>

      <form id="feedback-form">
        <div class="field-row">
          <textarea id="feedback-text" class="field-input" rows="6" maxlength="2000" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="action-row">
          <button type="submit" id="feedback-submit-btn" class="btn-primary">Send feedback</button>
          <span id="feedback-msg" class="save-msg"></span>
        </div>
      </form>
    </div>
  </div>

  <script>
    (() => {
      const form   = document.getElementById("feedback-form");
      const text   = document.getElementById("feedback-text");
      const btn    = document.getElementById("feedback-submit-btn");
      const msgEl  = document.getElementById("feedback-msg");
      const setMsg = (t, cls) => { msgEl.textContent = t; msgEl.className = `save-msg ${cls}`; };

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const value = text.value.trim();
        if (!value) { setMsg("Please enter some feedback first.", "err"); return; }
        btn.disabled = true;
        setMsg("Sending…", "");
        try {
          const r = await fetch("/api/product-feedback", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: value }),
          });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `${r.status} ${r.statusText}`);
          text.value = "";
          setMsg("Thanks — feedback sent.", "ok");
        } catch (err) {
          setMsg(err.message, "err");
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>

</body>
</html>
