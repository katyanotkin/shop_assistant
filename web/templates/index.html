<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__APP_NAME__ — __APP_MOTTO__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F59E0B">
</head>
<body>
  <div id="login-overlay" class="login-overlay" hidden>
    <form id="login-form" class="login-card">
      <h2 class="login-title">Admin sign in</h2>
      <p id="login-err" class="login-err" hidden></p>
      <input type="password" id="admin-pwd" class="field-input" placeholder="Password" autofocus>
      <div class="login-actions">
        <button type="submit" class="btn-primary">Sign in</button>
        <button type="button" id="login-cancel" class="btn-run">Cancel</button>
      </div>
    </form>
  </div>

  <header class="topbar">
    <span class="topbar-logo">
      <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="30" height="30">
      <span class="topbar-brand">__APP_NAME__</span>
      <span class="topbar-motto">__APP_MOTTO__</span>
    </span>
    <div class="topbar-actions">
      <div id="user-slot" class="topbar-user-slot"></div>
      <button id="topbar-admin-btn" class="topbar-admin-btn">Admin</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-label">Searches</span>
        <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Collapse sidebar">◀</button>
      </div>
      <ul class="search-list" id="search-list" role="listbox" aria-label="Product searches"></ul>
      <div class="sidebar-footer">
        <a href="/privacy" class="sidebar-footer-link">Privacy</a>
        <span class="sidebar-footer-sep">·</span>
        <a href="/terms" class="sidebar-footer-link">Terms</a>
      </div>
    </nav>

    <main class="content" id="content">
      <div class="toolbar" id="toolbar" hidden>
        <label for="date-select" class="date-label">Run date</label>
        <select id="date-select" class="date-select" aria-label="Run date"></select>
        <button id="edit-search-btn" class="btn-run" hidden>Edit</button>
        <button id="run-search-btn" class="btn-run" hidden>Run ▶</button>
      </div>

      <div id="criteria-bar" class="criteria-bar" hidden></div>

      <div id="results-panel">
        <p class="empty-state">Select a search from the left to view results.</p>
      </div>
    </main>

    <aside id="edit-panel" class="edit-panel" hidden></aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
