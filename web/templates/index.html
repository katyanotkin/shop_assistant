<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__APP_NAME__ — __APP_MOTTO__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#F59E0B">
</head>
<body>
  <header class="topbar">
    <span class="topbar-logo">
      <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="30" height="30">
      <span class="topbar-brand">__APP_NAME__</span>
      <span class="topbar-motto">__APP_MOTTO__</span>
    </span>
    <a href="/admin" class="topbar-admin-btn">Admin ↗</a>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <p class="sidebar-label">Searches</p>
      <ul class="search-list" id="search-list" role="listbox" aria-label="Product searches"></ul>
    </nav>

    <main class="content" id="content">
      <div class="toolbar" id="toolbar" hidden>
        <label for="date-select" class="date-label">Run date</label>
        <select id="date-select" class="date-select" aria-label="Run date"></select>
      </div>

      <div id="results-panel">
        <p class="empty-state">Select a search from the left to view results.</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
