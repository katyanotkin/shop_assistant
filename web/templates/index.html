<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Assistant</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar-logo">Shop Assistant</span>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <p class="sidebar-label">Searches</p>
      <ul class="search-list" id="search-list" role="listbox" aria-label="Product searches"></ul>
    </nav>

    <main class="content" id="content">
      <div class="toolbar" id="toolbar" hidden>
        <label for="date-select" class="date-label">Run date</label>
        <select id="date-select" class="date-select" aria-label="Run date"></select>
      </div>

      <div id="results-panel">
        <p class="empty-state">Select a search from the left to view results.</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
