<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — __APP_NAME__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
  <meta name="theme-color" content="#F59E0B">
</head>
<body>
  <header class="topbar">
    <span class="topbar-logo">
      <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="30" height="30">
      <span class="topbar-brand">__APP_NAME__</span>
      <span class="topbar-motto">__APP_MOTTO__</span>
    </span>
    <nav class="topbar-nav">
      <a href="/" class="topbar-admin-btn">← Results</a>
      <button id="btn-logout" class="btn-logout">Log out</button>
    </nav>
  </header>

  <div class="admin-layout" id="admin-layout">
    <nav class="admin-sidebar" id="admin-sidebar">
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse searches panel" aria-expanded="true" title="Collapse searches">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sidebar-inner">
        <p class="sidebar-label">Searches</p>
        <ul class="search-list" id="admin-search-list" role="listbox"></ul>
        <button class="btn-new-search" id="btn-new-search">+ New search</button>
        <button class="btn-new-search" id="btn-users">Users</button>
      </div>
    </nav>

    <div class="admin-panels">
      <section class="admin-panel admin-panel--config" id="config-panel" aria-label="Config">
        <div class="config-panel-header">
          <button class="panel-collapse-btn" id="config-collapse-btn" title="Collapse config" aria-label="Collapse config" aria-expanded="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div id="config-content"><p class="empty-state">Select a search to edit.</p></div>
      </section>
      <section class="admin-panel admin-panel--results" id="results-panel" aria-label="Results">
        <p class="empty-state">Select a search to view results.</p>
      </section>
    </div>
  </div>

  <script src="/static/feedback.js"></script>
  <script src="/static/criteria-form.js"></script>
  <script src="/static/references.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
