<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — __APP_NAME__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
  <meta name="theme-color" content="#F59E0B">
</head>
<body>
  <header class="topbar">
    <span class="topbar-logo">
      <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="30" height="30">
      <span class="topbar-brand">__APP_NAME__</span>
      <span class="topbar-motto">__APP_MOTTO__</span>
    </span>
    <nav class="topbar-nav">
      <a href="/" class="topbar-link">Results</a>
      <span class="topbar-link active">Admin</span>
    </nav>
  </header>

  <div id="login-overlay" class="login-overlay" hidden>
    <form id="login-form" class="login-card">
      <h2 class="login-title">Admin</h2>
      <p id="login-err" class="login-err" hidden></p>
      <input type="password" id="pwd" class="field-input" placeholder="Password" autofocus>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
  </div>

  <div class="layout" id="admin-layout" hidden>
    <nav class="sidebar">
      <p class="sidebar-label">Searches</p>
      <ul class="search-list" id="admin-search-list" role="listbox"></ul>
      <button class="btn-new-search" id="btn-new-search">+ New search</button>
    </nav>
    <main class="content" id="admin-content">
      <p class="empty-state">Select a search to edit.</p>
    </main>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
