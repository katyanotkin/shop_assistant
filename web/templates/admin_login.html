<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin sign in — __APP_NAME__</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="icon" type="image/svg+xml" href="/static/shpopassistant.svg">
</head>
<body class="admin-login-page">
  <div class="admin-login-wrap">
    <div class="login-card">
      <div class="topbar-logo" style="justify-content:center;margin-bottom:20px">
        <img src="/static/shpopassistant.svg" alt="" class="topbar-logo-img" width="36" height="36">
        <span class="topbar-brand">__APP_NAME__</span>
      </div>

      <h2 class="login-title">Admin sign in</h2>

      <a href="/auth/login?next=/admin" class="btn-google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.2 13 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-9.9 6.9-16.5 0-.8-.1-1.6-.2-2.5z" transform="translate(-.3 0)"/>
          <path fill="#FBBC05" d="M10.4 28.7A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.8 23.8 0 0 0 0 24c0 3.8.9 7.4 2.6 10.6l7.8-5.9z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.5-5.8c-2.1 1.4-4.7 2.3-7.8 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 5.9C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Sign in with Google
      </a>

      <div class="login-divider"><span>or</span></div>

      <form method="post" action="/admin/login" class="admin-password-form">
        <p id="login-err" class="login-err" hidden>Wrong password.</p>
        <input type="password" name="password" class="field-input" placeholder="Admin password">
        <button type="submit" class="btn-primary" style="width:100%;margin-top:8px">Sign in with password</button>
      </form>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("login-err").hidden = false;
      document.querySelector("[name=password]").focus();
    } else {
      document.querySelector("a.btn-google-signin").focus();
    }
  </script>
</body>
</html>
