fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: pytest-all
        name: pytest all tests
        entry: bash -c 'PYTHONPATH=. .venv/bin/pytest -q -x --tb=short tests/'
        language: system
        pass_filenames: false
        files: \.(py|json)$
